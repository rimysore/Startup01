[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolslim"
version = "0.1.0"
description = "Cut the token cost of MCP tool schemas: slim them, or load them lazily."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Embedding retrieval. wordllama bundles its weights in the wheel (no model download).
dense = ["numpy", "wordllama>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]
